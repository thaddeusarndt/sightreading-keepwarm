name: keep-warm

# Pings the Notespawn app so Render's free tier never cold-starts.
#
# GitHub treats "*/10" as a hint, not a promise. Measured delivery on this repo
# is roughly ONE run per hour (and a 6-hour hole on 2026-08-06), while Render's
# free tier sleeps after 15 minutes idle -- so one curl per run left the app
# asleep for most of the day. Each run now pings on its own 4-minute loop for
# ~55 minutes, which bridges the gap between whatever runs GitHub actually
# gives us. Overlapping runs are harmless (public repo, minutes are free).
on:
  schedule:
    # Render's free tier gives the whole workspace 750 instance hours a month,
    # and it bills time the service is AWAKE, not traffic -- so pinging around
    # the clock burns ~744 hours in a 31-day month and leaves no margin at all.
    # (That is exactly how we ended up at 637/750 on 2026-08-27.)
    #
    # Nobody sight-reads at 4am, so the loop only runs 6am-midnight Pacific
    # (13:00-07:00 UTC). That is ~19 awake hours a day including the tail of
    # the last run, or ~589 hours a month -- a comfortable margin. The only
    # cost is one cold start for the first visitor after a quiet night.
    #
    # Cron is fixed UTC, so this slides to 5am-11pm Pacific once DST ends.
    - cron: "*/10 13-23 * * *"
    - cron: "*/10 0-6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Ping health endpoint on a loop
        run: |
          url="https://sightreading-generator.onrender.com/api/health"
          deadline=$(( $(date +%s) + 55 * 60 ))
          misses=0
          while :; do
            # -m 90 (not 60) so a genuine cold start isn't scored as an outage
            code=$(curl -sS -m 90 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || true)
            [ -n "$code" ] || code="000"
            echo "$(date -u +%H:%M:%S)Z  $code"
            if [ "$code" = "200" ]; then
              misses=0
            else
              misses=$(( misses + 1 ))
              # Three in a row (~8 min) is an outage, not a blip. Fail loudly so
              # the "Run failed" e-mail actually means the site is down -- the old
              # script swallowed every curl error and always reported success.
              if [ "$misses" -ge 3 ]; then
                echo "::error::$url unhealthy $misses times in a row (last code: $code)"
                exit 1
              fi
            fi
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep 240
          done
